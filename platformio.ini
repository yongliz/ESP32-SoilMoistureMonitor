[platformio]
default_envs = esp32dev
; Workaround: the project directory name contains a non-ASCII character
; (U+2011 non-breaking hyphen in "ESP32‑SoilMoistureMonitor"). The Xtensa ESP32
; cross-compiler (xtensa-esp32-elf-g++) cannot open files whose path contains
; non-ASCII characters on Windows, so the default `.pio` workspace under the
; project root fails to build. Relocating the workspace to an ASCII-only path
; fixes the build. The native (MinGW) toolchain is unaffected either way.
workspace_dir = D:/workspace/esp_project/_pio_ws

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ; brief specified ^1.7.2, but that version does not exist on the
    ; PlatformIO registry; latest published is 1.6.9.
    zinggjm/GxEPD2@^1.6.9

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
